<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>LIVE QUOTES PROBE 2</title>
<style>body{font:13px/1.5 monospace;background:#0b1220;color:#e2e8f0;padding:14px}pre{white-space:pre-wrap;word-break:break-all}</style>
</head><body>
<h2>PROBE2 <span id="st">running…</span></h2><pre id="out"></pre>
<script>
(function(){
  var enc=encodeURIComponent;
  var CODES='058470,443060,0161M0,010120,003490,005380,047810,196170,010950,010140,005930,240810,042700,009150,000660,015760';
  var N16='https://polling.finance.naver.com/api/realtime/domestic/stock/'+CODES;
  var out=document.getElementById('out'); var lines=[]; var n=0; var total=7;
  function show(){ out.textContent=lines.join('\n'); }
  function bump(){ n++; if(n>=total) document.getElementById('st').textContent='DONE '+n+' @ '+new Date().toLocaleTimeString('ko-KR'); }
  function grab(txt){
    var i=txt.indexOf('{'), j=txt.lastIndexOf('}');
    if(i<0||j<0) return null;
    try{ return JSON.parse(txt.slice(i,j+1)); }catch(e){ return 'PARSE_ERR '+e.message; }
  }
  function get(url,opts){
    var t0=Date.now(), ctrl=new AbortController(), to=setTimeout(function(){ctrl.abort();},25000);
    var o={signal:ctrl.signal,cache:'no-store',mode:'cors'}; if(opts&&opts.headers) o.headers=opts.headers;
    return fetch(url,o).then(function(r){return r.text().then(function(t){return {s:r.status,t:t,ms:Date.now()-t0};});})
      .catch(function(e){return {err:String(e&&e.message||e),ms:Date.now()-t0};})
      .then(function(x){clearTimeout(to);return x;});
  }
  // 1) jina plain (all 16)
  get('https://r.jina.ai/'+N16).then(function(x){
    if(x.err){ lines.push('jina-plain ERR '+x.err+' '+x.ms+'ms'); show(); bump(); return; }
    var d=grab(x.t);
    var info = (d&&d.datas)? 'datas='+d.datas.length+' first='+d.datas[0].stockName+' '+d.datas[0].closePrice+' '+d.datas[0].localTradedAt+' interval='+d.pollingInterval : String(d);
    lines.push('jina-plain ['+x.s+'] '+x.ms+'ms len='+x.t.length+' :: '+info);
    lines.push('jina-head: '+JSON.stringify(x.t.slice(0,300)));
    var d5=d&&d.datas?d.datas[4]:null;
    show(); bump();
    // 2) jina again after 4s for freshness
    setTimeout(function(){
      get('https://r.jina.ai/'+N16).then(function(y){
        if(y.err){ lines.push('jina-again ERR '+y.err+' '+y.ms+'ms'); show(); bump(); return; }
        var d2=grab(y.t); var d25=d2&&d2.datas?d2.datas[4]:null;
        lines.push('jina-again ['+y.s+'] '+y.ms+'ms len='+y.t.length+' :: first='+(d2&&d2.datas?d2.datas[0].closePrice:'?')+' t0='+(d5?d5.localTradedAt:'?')+' t1='+(d25?d25.localTradedAt:'?')+' changed='+(d5&&d25&&d5.localTradedAt!==d25.localTradedAt));
        show(); bump();
      });
    },4000);
  });
  // 3) jina with no-cache header
  get('https://r.jina.ai/'+N16,{headers:{'x-no-cache':'true'}}).then(function(x){
    if(x.err) lines.push('jina-nocache ERR '+x.err+' '+x.ms+'ms');
    else { var d=grab(x.t); lines.push('jina-nocache ['+x.s+'] '+x.ms+'ms len='+x.t.length+' :: '+(d&&d.datas?'datas='+d.datas.length+' first='+d.datas[0].closePrice+' '+d.datas[0].localTradedAt:String(d).slice(0,120))); }
    show(); bump();
  });
  // 4) allorigins long timeout
  get('https://api.allorigins.win/raw?url='+enc(N16)).then(function(x){
    if(x.err) lines.push('allorigins ERR '+x.err+' '+x.ms+'ms');
    else { var d=grab(x.t); lines.push('allorigins ['+x.s+'] '+x.ms+'ms len='+x.t.length+' :: '+(d&&d.datas?'datas='+d.datas.length+' first='+d.datas[0].closePrice:String(d).slice(0,120))); }
    show(); bump();
  });
  // 5) codetabs long timeout
  get('https://api.codetabs.com/v1/proxy?quest='+enc(N16)).then(function(x){
    if(x.err) lines.push('codetabs ERR '+x.err+' '+x.ms+'ms');
    else { var d=grab(x.t); lines.push('codetabs ['+x.s+'] '+x.ms+'ms len='+x.t.length+' :: '+(d&&d.datas?'datas='+d.datas.length+' first='+d.datas[0].closePrice:String(d).slice(0,120))); }
    show(); bump();
  });
  // 6) jina on naver basic single (per-code fallback)
  get('https://r.jina.ai/https://m.stock.naver.com/api/stock/0161M0/basic').then(function(x){
    if(x.err) lines.push('jina-basic ERR '+x.err+' '+x.ms+'ms');
    else { var d=grab(x.t); lines.push('jina-basic ['+x.s+'] '+x.ms+'ms len='+x.t.length+' :: '+(d&&d.stockName?d.stockName+' '+d.closePrice+' '+d.fluctuationsRatio+'%':String(d).slice(0,120))); }
    show(); bump();
  });
  // 7) jina docs endpoint check via HEAD-ish fetch of a second host style
  get('https://r.jina.ai/https://polling.finance.naver.com/api/realtime/domestic/stock/005930').then(function(x){
    if(x.err) lines.push('jina-single ERR '+x.err+' '+x.ms+'ms');
    else { var d=grab(x.t); lines.push('jina-single ['+x.s+'] '+x.ms+'ms :: '+(d&&d.datas?d.datas[0].stockName+' '+d.datas[0].closePrice:String(d).slice(0,120))); }
    show(); bump();
  });
})();
</script></body></html>
