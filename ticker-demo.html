    /* =====================================================================

    .bottom-ticker-bar {

      color: #ffffff; white-space: nowrap; z-index: 2;

    .bt-live-led {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.45); vertical-align: middle; flex: 0 0 auto;
      box-shadow: 0 0 0 0 rgba(244,63,94,0);
    }
    .bt-live-led.on { background: #f43f5e; animation: btLedPulse 1.6s ease-in-out infinite; }
    .bt-live-led.warn { background: #fbbf24; animation: btLedPulse 2.6s ease-in-out infinite; }
    .bt-live-led.off { background: rgba(255,255,255,0.42); animation: none; }
    @keyframes btLedPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.55); opacity: 1; }
      50% { box-shadow: 0 0 0 4px rgba(244,63,94,0); opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) { .bt-live-led { animation: none !important; } }
    .bt-viewport {
      position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden;
      display: flex; align-items: center;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
    }
    .bt-track {
      display: inline-flex; align-items: center; white-space: nowrap; will-change: transform;
      animation: btTicker 42s linear infinite;
    }
    @keyframes btTicker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    /* 마우스 호버 시 일시정지 (JS 인라인 상태와 무관하게 항상 동작하도록 !important) */
    .bottom-ticker-bar:hover .bt-track { animation-play-state: paused !important; }
    .bt-item {
      display: inline-flex; align-items: baseline; gap: 6px; padding: 0 16px;
      font-size: 0.85rem; font-weight: 800; letter-spacing: -0.02em; line-height: 2.45;
    }
    .bt-item + .bt-item { border-left: 1px solid var(--border); }
    .bt-name { color: var(--text); font-weight: 900; }
    .bt-price { color: var(--text-sub); font-weight: 800; font-variant-numeric: tabular-nums; }
    .bt-chg { font-weight: 900; font-variant-numeric: tabular-nums; }
    .bt-chg.up { color: #dc2626; }
    .bt-chg.down { color: #2563eb; }
    .bt-chg.flat { color: var(--text-sub); }
    body.dark .bt-chg.up { color: #f87171; }
    body.dark .bt-chg.down { color: #60a5fa; }
    body.dark .bt-name { color: #f1f5fb; }
    body.dark .bt-price { color: #b6c6dc; }
    body.trial-expired-locked .bottom-ticker-bar {
      filter: blur(8px); pointer-events: none !important; user-select: none !important;
    }
    @media (max-width: 480px) {
      /* 모바일에서는 라벨을 한 줄로 줄여 마키 표시 폭을 확보한다 (잘림 방지) */
      .bt-label { padding: 7px 10px; font-size: 0.7rem; }
      .bt-label em { display: none; }
      .bt-item { font-size: 0.8rem; padding: 0 12px; line-height: 2.4; }
    }
    /* 하단 전광판·푸터·플로팅 독 사이 간격 정리 (겹침 방지) */
    @media (max-width: 768px) {
      .bottom-ticker-bar { margin: 22px 0 10px; border-radius: 14px; }
      footer { padding-bottom: 6px; }
    }

<h3>📡 LIVE QUOTES 실시간 전광판 · 실제 index.html 코드 그대로 (2026-11-25 장중)</h3>
<div class="bottom-ticker-bar" id="bottomStockTicker" aria-label="대표 종목 실시간 현재가 전광판">

<p class="note">※ 실제 portal index.html 의 CSS·마크업·btLive 폴링 엔진을 그대로 추출한 검증 전용 데모 (배포 후 삭제)</p>

<script>
const TURNAROUND_MASTER_DATA = {"443060": {"name": "HD현대마린솔루션", "priceStr": "187,300원", "changeStr": "+6.30%", "currentPrice": 187300.0}, "003490": {"name": "대한항공", "priceStr": "31,150원", "changeStr": "+2.47%", "currentPrice": 31150.0}, "005380": {"name": "현대차", "priceStr": "275,000원", "changeStr": "+10.66%", "currentPrice": 275000.0}, "047810": {"name": "한국항공우주", "priceStr": "99,800원", "changeStr": "+5.05%", "currentPrice": 99800.0}, "196170": {"name": "알테오젠", "priceStr": "159,700원", "changeStr": "-5.50%", "currentPrice": 159700.0}, "010950": {"name": "S-Oil", "priceStr": "94,400원", "changeStr": "+1.07%", "currentPrice": 94400.0}, "010140": {"name": "삼성중공업", "priceStr": "14,970원", "changeStr": "+3.03%", "currentPrice": 14970.0}, "058470": {"name": "리노공업", "priceStr": "48,500원", "changeStr": "+6.01%", "currentPrice": 48500.0}, "0161M0": {"name": "네오사피엔스", "priceStr": "4,555원", "changeStr": "+1.79%", "currentPrice": 4555.0}, "005930": {"name": "삼성전자", "priceStr": "189,400원", "changeStr": "+4.87%", "currentPrice": 189400.0}, "240810": {"name": "원익IPS", "priceStr": "71,600원", "changeStr": "+6.39%", "currentPrice": 71600.0}, "010120": {"name": "LS ELECTRIC", "priceStr": "122,000원", "changeStr": "+8.93%", "currentPrice": 122000.0}, "042700": {"name": "한미반도체", "priceStr": "163,600원", "changeStr": "+6.16%", "currentPrice": 163600.0}, "009150": {"name": "삼성전기", "priceStr": "858,000원", "changeStr": "+7.65%", "currentPrice": 858000.0}, "000660": {"name": "SK하이닉스", "priceStr": "1,158,000원", "changeStr": "+5.18%", "currentPrice": 1158000.0}, "015760": {"name": "한국전력", "priceStr": "25,400원", "changeStr": "+2.01%", "currentPrice": 25400.0}};
function getLatestRadarDateInfo(){ return { date:'11-25', stage:'08:00 장전', full:'11-25 08:00 장전' }; }
    const BOTTOM_TICKER_CORE_CODES = ['058470', '443060', '0161M0', '010120'];
    function renderBottomStockTicker() {
      const bar = document.getElementById('bottomStockTicker');
      const track = document.getElementById('bottomTickerTrack');
      if (!bar || !track || typeof TURNAROUND_MASTER_DATA === 'undefined') return;
      const allCodes = Object.keys(TURNAROUND_MASTER_DATA);
      const coreCodes = BOTTOM_TICKER_CORE_CODES.filter(function (c) { return allCodes.indexOf(c) !== -1; });
      const codes = coreCodes.concat(allCodes.filter(function (c) { return coreCodes.indexOf(c) === -1; }));
      const items = codes.map(function (code) {
        const d = TURNAROUND_MASTER_DATA[code];
        if (!d) return '';
        const chg = d.changeStr || '0.00%';
        const cls = chg.charAt(0) === '+' ? 'up' : (chg.charAt(0) === '-' ? 'down' : 'flat');
        const price = d.priceStr || (d.currentPrice ? Number(d.currentPrice).toLocaleString('ko-KR') + '원' : '-');
        return '<span class="bt-item" data-code="' + code + '">'
          + '<span class="bt-name">' + (d.name || code) + '</span>'
          + '<span class="bt-price">' + price + '</span>'
          + '<span class="bt-chg ' + cls + '">' + chg + '</span>'
          + '</span>';
      }).join('');
      // 이음새 없는 무한 루프: 동일 목록 2회 반복 + translateX(-50%)
      track.innerHTML = items + items;
      track.style.animationDuration = Math.max(30, Math.round(codes.length * 3.2)) + 's';
      track.style.animationPlayState = 'running';
      bar.setAttribute('data-count', String(codes.length));
      const asOf = document.getElementById('btAsOf');
      // 실시간 폴링이 값을 잡고 있으면 그 라벨(실시간 HH:MM:SS 갱신)을 덮어쓰지 않는다.
      if (asOf && typeof btLiveStatusIsActive === 'function' && btLiveStatusIsActive()) {
        /* live label 유지 */
      } else if (asOf && typeof getLatestRadarDateInfo === 'function') {
        try {
          const info = getLatestRadarDateInfo();
          if (info && info.full) asOf.textContent = info.full;
        } catch (e) { /* noop */ }
      }
      // 재렌더링 직후에도 마지막 실시간 시세를 즉시 제자리 적용(마키 끊김 없음)
      if (typeof btLiveRepaintCached === 'function') btLiveRepaintCached();
    }
    function initBottomStockTickerPause() {
      const bar = document.getElementById('bottomStockTicker');
      const track = document.getElementById('bottomTickerTrack');
      if (!bar || !track) return;
      const pause = function () { track.style.animationPlayState = 'paused'; };
      const resume = function () { track.style.animationPlayState = 'running'; };
      bar.addEventListener('mouseenter', pause);
      bar.addEventListener('mouseleave', resume);
      bar.addEventListener('touchstart', pause, { passive: true });
      bar.addEventListener('touchend', resume, { passive: true });
      bar.addEventListener('touchcancel', resume, { passive: true });
    }

    // =========================================================================
    // 📡 하단 LIVE QUOTES 실시간 폴링 엔진 (#bottomStockTicker · #btAsOf · #btLiveLed)
    // ※ 실측 검증 경로 (2026-11-25 13:26 KST · github.io 오리진 브라우저 fetch 성공)
    //    네이버 금융 폴링 API(다종목 1회 호출) → CORS 프록시 체인(r.jina.ai 리더) → JSON 파싱
    //    · 직접 호출(m.stock.naver.com / polling.finance.naver.com / yahoo / daum)은
    //      Origin: https://xeroxyyk-commits.github.io 에서 CORS 차단(403·Failed to fetch) 실측.
    //    · corsproxy.io(401 키 필요) · allorigins(17초 타임아웃) · codetabs(20초 타임아웃) 실패 실측.
    //    · 프록시 2차 경로: 종목별 m.stock.naver.com/api/stock/{code}/basic (누락 종목만 보충)
    // 25초 주기 자동 갱신 · 탭 백그라운드(document.hidden)에서는 호출 중지 후 복귀 즉시 갱신.
    // ※ 마키(.bt-track)는 재생성하지 않고 .bt-item 의 .bt-price/.bt-chg 텍스트만 제자리 갱신한다.
    // ※ 이 폴링 엔진(btLive* 함수·주기·폴백 로직)은 절대 삭제·덮어쓰지 말 것.
    // =========================================================================
    var BOTTOM_LIVE_QUOTE_INTERVAL_MS = 25000;
    var BOTTOM_LIVE_PROXY = 'https://r.jina.ai/';
    var BOTTOM_LIVE_STATE = {
      started: false, timer: null, inflight: false, quotes: {}, lastOkAt: null,
      lastTradeAt: '', marketStatus: '', failStreak: 0, source: '', labelKind: ''
    };

    function btLiveCodes() {
      var all = (typeof TURNAROUND_MASTER_DATA !== 'undefined') ? Object.keys(TURNAROUND_MASTER_DATA) : [];
      var core = (typeof BOTTOM_TICKER_CORE_CODES !== 'undefined' ? BOTTOM_TICKER_CORE_CODES : [])
        .filter(function (c) { return all.indexOf(c) !== -1; });
      return core.concat(all.filter(function (c) { return core.indexOf(c) === -1; }));
    }

    function btLiveNumber(v) {
      var n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
      return isFinite(n) ? n : null;
    }

    function btLiveFetchText(url, noCache) {
      return new Promise(function (resolve, reject) {
        var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var to = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 12000) : null;
        var opts = { method: 'GET', mode: 'cors', cache: 'no-store', credentials: 'omit' };
        if (ctrl) opts.signal = ctrl.signal;
        if (noCache) opts.headers = { 'x-no-cache': 'true' };
        fetch(url, opts).then(function (r) {
          if (to) clearTimeout(to);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        }).then(resolve).catch(function (err) {
          if (to) clearTimeout(to);
          // 커스텀 헤더(preflight) 실패 시 헤더 없이 1회 재시도
          if (noCache) {
            btLiveFetchText(url, false).then(resolve).catch(reject);
          } else {
            reject(err);
          }
        });
      });
    }

    function btLiveParseJson(txt) {
      if (!txt) return null;
      var i = txt.indexOf('{');
      var j = txt.lastIndexOf('}');
      if (i < 0 || j <= i) return null;
      try { return JSON.parse(txt.slice(i, j + 1)); } catch (e) { return null; }
    }

    function btLiveMapDatas(datas) {
      var map = {};
      (datas || []).forEach(function (d) {
        if (!d || !d.itemCode) return;
        var price = btLiveNumber(d.closePrice);
        if (price === null || price <= 0) return;
        var pct = btLiveNumber(d.fluctuationsRatio);
        map[d.itemCode] = {
          price: price,
          pct: pct === null ? 0 : pct,
          at: d.localTradedAt || '',
          status: d.marketStatus || ''
        };
      });
      return map;
    }

    function btLivePaint(map) {
      var track = document.getElementById('bottomTickerTrack');
      if (!track || !map) return 0;
      var items = track.querySelectorAll('.bt-item');
      var painted = 0;
      for (var k = 0; k < items.length; k++) {
        var el = items[k];
        var code = el.getAttribute('data-code');
        var q = code ? map[code] : null;
        if (!q) continue;
        var priceEl = el.querySelector('.bt-price');
        var chgEl = el.querySelector('.bt-chg');
        var priceTxt = q.price.toLocaleString('ko-KR') + '원';
        var pctTxt = (q.pct > 0 ? '+' : '') + q.pct.toFixed(2) + '%';
        var cls = q.pct > 0 ? 'up' : (q.pct < 0 ? 'down' : 'flat');
        if (priceEl && priceEl.textContent !== priceTxt) priceEl.textContent = priceTxt;
        if (chgEl) {
          if (chgEl.textContent !== pctTxt) chgEl.textContent = pctTxt;
          var want = 'bt-chg ' + cls;
          if (chgEl.className !== want) chgEl.className = want;
        }
        painted++;
      }
      if (painted) {
        BOTTOM_LIVE_STATE.quotes = map;
        var bar = document.getElementById('bottomStockTicker');
        if (bar) bar.setAttribute('data-live', '1');
      }
      return painted;
    }

    function btLiveRepaintCached() {
      if (!BOTTOM_LIVE_STATE || !BOTTOM_LIVE_STATE.quotes) return 0;
      return btLivePaint(BOTTOM_LIVE_STATE.quotes);
    }

    function btLiveStatusIsActive() {
      return !!(BOTTOM_LIVE_STATE && BOTTOM_LIVE_STATE.labelKind);
    }

    function btLiveClock(atIso) {
      var d = null;
      if (atIso) d = new Date(atIso);
      if (!d || isNaN(d.getTime())) d = new Date();
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      var ss = String(d.getSeconds()).padStart(2, '0');
      return hh + ':' + mm + ':' + ss;
    }

    function btLiveSetStatus(kind, atIso, marketStatus) {
      var asOf = document.getElementById('btAsOf');
      var led = document.getElementById('btLiveLed');
      BOTTOM_LIVE_STATE.labelKind = kind;
      var clock = btLiveClock(atIso);
      var st = marketStatus || BOTTOM_LIVE_STATE.marketStatus || '';
      if (kind === 'live') {
        if (asOf) asOf.textContent = '실시간 ' + clock + ' 갱신' + (st === 'OPEN' ? ' · 장중' : (st === 'CLOSE' ? ' · 정규장 마감' : ''));
        if (led) led.className = 'bt-live-led on';
      } else if (kind === 'stale') {
        if (asOf) asOf.textContent = '재연결 중 · ' + clock + ' 값 유지';
        if (led) led.className = 'bt-live-led warn';
      } else {
        if (asOf) asOf.textContent = '기준가 표시 · 실시간 재연결 중';
        if (led) led.className = 'bt-live-led off';
      }
    }

    function btLiveApplySuccess(map, source) {
      var painted = btLivePaint(map);
      if (!painted) return false;
      var first = null;
      for (var k in map) { first = map[k]; break; }
      BOTTOM_LIVE_STATE.lastOkAt = Date.now();
      BOTTOM_LIVE_STATE.failStreak = 0;
      BOTTOM_LIVE_STATE.source = source || '';
      BOTTOM_LIVE_STATE.marketStatus = first ? first.status : '';
      BOTTOM_LIVE_STATE.lastTradeAt = first ? first.at : '';
      btLiveSetStatus('live', BOTTOM_LIVE_STATE.lastTradeAt, BOTTOM_LIVE_STATE.marketStatus);
      return true;
    }

    function btLiveApplyFailure() {
      BOTTOM_LIVE_STATE.failStreak++;
      var hasCache = BOTTOM_LIVE_STATE.quotes && Object.keys(BOTTOM_LIVE_STATE.quotes).length > 0;
      if (hasCache) {
        btLiveSetStatus('stale', BOTTOM_LIVE_STATE.lastTradeAt);
      } else {
        btLiveSetStatus('fallback', null);
        // 마스터 기준가로 안전 복귀 (renderBottomStockTicker 가 확정 종가로 다시 그린다)
        var asOf = document.getElementById('btAsOf');
        var fallbackLabel = '기준가 표시 · 실시간 재연결 중';
        try {
          if (typeof getLatestRadarDateInfo === 'function') {
            var info = getLatestRadarDateInfo();
            if (info && info.full) fallbackLabel = info.full + ' 기준가 · 실시간 재연결 중';
          }
        } catch (e) { /* noop */ }
        if (asOf) asOf.textContent = fallbackLabel;
      }
    }

    function btLiveFetchMissing(map, codes) {
      var missing = codes.filter(function (c) { return !map[c]; }).slice(0, 8);
      if (!missing.length) return Promise.resolve(map);
      return Promise.all(missing.map(function (code) {
        var url = BOTTOM_LIVE_PROXY + 'https://m.stock.naver.com/api/stock/' + code + '/basic';
        return btLiveFetchText(url, true).then(function (txt) {
          var obj = btLiveParseJson(txt);
          if (!obj || !obj.closePrice) return null;
          var price = btLiveNumber(obj.closePrice);
          if (price === null || price <= 0) return null;
          var pct = btLiveNumber(obj.fluctuationsRatio);
          return {
            code: code,
            q: { price: price, pct: pct === null ? 0 : pct, at: obj.localTradedAt || '', status: obj.marketStatus || '' }
          };
        }).catch(function () { return null; });
      })).then(function (rows) {
        rows.forEach(function (r) { if (r && r.code && r.q) map[r.code] = r.q; });
        return map;
      });
    }

    function btLiveRefresh() {
      if (BOTTOM_LIVE_STATE.inflight) return Promise.resolve(false);
      BOTTOM_LIVE_STATE.inflight = true;
      var codes = btLiveCodes();
      if (!codes.length) { BOTTOM_LIVE_STATE.inflight = false; return Promise.resolve(false); }
      var target = 'https://polling.finance.naver.com/api/realtime/domestic/stock/' + codes.join(',');
      return btLiveFetchText(BOTTOM_LIVE_PROXY + target, true)
        .then(function (txt) {
          var obj = btLiveParseJson(txt);
          var map = (obj && obj.datas) ? btLiveMapDatas(obj.datas) : {};
          if (!Object.keys(map).length) throw new Error('empty quotes');
          return btLiveFetchMissing(map, codes);
        })
        .then(function (map) {
          BOTTOM_LIVE_STATE.inflight = false;
          return btLiveApplySuccess(map, 'naver-polling@jina');
        })
        .catch(function (err) {
          BOTTOM_LIVE_STATE.inflight = false;
          console.warn('[LIVE QUOTES] 실시간 시세 수신 실패 → 기준가 폴백:', err && err.message ? err.message : err);
          btLiveApplyFailure();
          return false;
        });
    }

    function btLiveStart() {
      if (BOTTOM_LIVE_STATE.started) return;
      BOTTOM_LIVE_STATE.started = true;
      btLiveRefresh();
      BOTTOM_LIVE_STATE.timer = setInterval(function () {
        if (typeof document !== 'undefined' && document.hidden) return; // 백그라운드에서는 쉼
        btLiveRefresh();
      }, BOTTOM_LIVE_QUOTE_INTERVAL_MS);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) btLiveRefresh(); // 다시 보이면 즉시 갱신
      });
      window.addEventListener('online', function () { btLiveRefresh(); });
    }

    function initBottomLiveQuotes() {
      try { btLiveStart(); } catch (e) { console.error('initBottomLiveQuotes failed:', e); }
    }


renderBottomStockTicker();
initBottomStockTickerPause();
initBottomLiveQuotes();
setInterval(function(){
  var s = BOTTOM_LIVE_STATE;
  document.getElementById('dbg').textContent = 'src=' + s.source + ' · lastOk=' + (s.lastOkAt? new Date(s.lastOkAt).toLocaleTimeString('ko-KR'):'-') + ' · codes=' + Object.keys(s.quotes||{}).length + ' · failStreak=' + s.failStreak + ' · tradeAt=' + s.lastTradeAt + ' · label=' + (document.getElementById('btAsOf')||{}).textContent;
}, 1000);

if (location.search.indexOf('failtest=1') >= 0) {
  setTimeout(function(){ btLiveApplyFailure(); }, 5000);
}
if (location.search.indexOf('failtest=2') >= 0) {
  setTimeout(function(){ BOTTOM_LIVE_STATE.quotes = {}; btLiveApplyFailure(); }, 5000);
}
</script>
